[package]
name = "dishsim-core"
description = "A spiking neuronal culture on a 64-electrode array: Izhikevich neurons, distance-dependent wiring, synaptic depression and STDP. Compiles to WebAssembly with no dependencies."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Arihanth Mutha"]
repository = "https://github.com/Arihanth-Mutha/dishsim"
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
